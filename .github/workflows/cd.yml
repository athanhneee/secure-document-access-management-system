name: cd

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # CONFLICT-RESOLVED: Đảo thứ tự pipeline CD để biên dịch + quét lỗ hổng Trivy ảnh container thành công trước khi chạy `pnpm db:migrate` lên CSDL Production (HIGH-12).
  publish-containers:
    name: Build, Scan & Publish GHCR Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: worker
            dockerfile: apps/worker/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CONFLICT-RESOLVED: Chuẩn hóa tên kho ảnh OCI về chữ thường trước khi đẩy và ký chứng thực SLSA để tránh lỗi GHCR khi tên owner/repo có chữ hoa ([LOW-03]).
      - name: Normalize lowercase OCI image name
        id: image_name
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}-${SERVICE}"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image_name.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build candidate container image for vulnerability scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image_name.outputs.name }}:scan-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan built container image with Trivy before registry publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ steps.image_name.outputs.name }}:scan-${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Push verified container image to GHCR
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.image_name.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  migrate-database:
    name: Deploy Database Migrations
    needs: [publish-containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check whether DIRECT_URL secret is configured
        id: check_secret
        run: |
          if [ -z "${DIRECT_URL}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DIRECT_URL secret not configured in GitHub Settings; skipping automatic database migration."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secret.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        if: steps.check_secret.outputs.configured == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        if: steps.check_secret.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        if: steps.check_secret.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply pending Prisma migrations
        if: steps.check_secret.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:migrate
