name: cd

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-supabase:
    name: Deploy Prisma Migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check whether DIRECT_URL secret is configured
        id: check_secret
        run: |
          if [ -z "${DIRECT_URL}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DIRECT_URL secret not configured in GitHub Settings; skipping automatic Supabase migration."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secret.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install pnpm
        if: steps.check_secret.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        if: steps.check_secret.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        if: steps.check_secret.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply pending Prisma migrations to Supabase
        if: steps.check_secret.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:migrate

  publish-containers:
    name: Build & Publish GHCR Images (${{ matrix.service }})
    needs: [migrate-supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: worker
            dockerfile: apps/worker/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push hardened container image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
