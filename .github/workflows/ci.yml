name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Dependency Graph availability
        id: dep_graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${REPO}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" || echo "000")
          if [ "${STATUS}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Dependency Graph returned HTTP ${STATUS}; falling back to pnpm audit --audit-level=high."
          fi

      - name: Dependency Review Action
        if: steps.dep_graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

      - name: Install pnpm for fallback audit
        if: steps.dep_graph.outputs.enabled != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1

      - name: Set up Node.js for fallback audit
        if: steps.dep_graph.outputs.enabled != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Audit dependencies via pnpm audit
        if: steps.dep_graph.outputs.enabled != 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level=high

  service-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      # CONFLICT-RESOLVED: Bỏ NODE_ENV: test ở cấp job để bước pnpm check -> pnpm build chạy next build ở chế độ production chuẩn, tránh nhúng 'unsafe-eval'.
      INFRA_RESET_TARGET: secure-document-access-system-local-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Start isolated service containers
        run: pnpm infra:up

      - name: Deploy database migrations and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Run mandatory quality, integration, infrastructure, and security gates
        run: |
          run_gate() {
            echo "=== Running gate: $1 ==="
            if ! pnpm "$1"; then
              echo "::error title=CI Gate Failed::pnpm $1 failed"
              exit 1
            fi
          }
          run_gate format:check
          run_gate lint
          run_gate typecheck
          run_gate test
          run_gate test:integration
          run_gate build
          run_gate test:e2e
          run_gate test:infra
          run_gate db:validate
          run_gate security:scan

      - name: Show container status and logs on failure
        if: failure()
        run: |
          if [ -f .local/dev.env ]; then
            docker compose --env-file .local/dev.env -f infra/compose.yaml -p secure-document-access-system-local ps
            docker compose --env-file .local/dev.env -f infra/compose.yaml -p secure-document-access-system-local logs --tail 200
          fi

      - name: Remove CI-only containers and volumes
        if: always()
        env:
          NODE_ENV: test
        run: |
          if [ -f .local/dev.env ]; then
            pnpm infra:reset-safe
          fi
