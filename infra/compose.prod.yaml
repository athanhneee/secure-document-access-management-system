name: secure-document-access-system-prod

x-prod-defaults: &prod-defaults
  restart: always
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  api:
    <<: *prod-defaults
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    image: secure-document-access-api:1.0.0
    user: '10001:10001'
    networks:
      - edge_loopback
      - backend_isolated
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    # CONFLICT-RESOLVED: Gắn chung volume export_data tại /var/lib/sda/exports cho cả api và worker thay vì /tmp/exports cô lập trên tmpfs riêng.
    volumes:
      - export_data:/var/lib/sda/exports
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOST: '0.0.0.0'
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Allowed CORS origins required}
      DATABASE_URL: ${DATABASE_URL:?Database connection required}
      REDIS_URL: ${REDIS_URL:?Redis connection required}
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY:?Master key required}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:?Audit integrity key required}
      DOCUMENT_AUDIT_HMAC_KEY: ${DOCUMENT_AUDIT_HMAC_KEY:?Document audit HMAC key required}
      AUTH_AUDIT_HMAC_KEY: ${AUTH_AUDIT_HMAC_KEY:?Auth audit HMAC key required}
      AUTH_SIGNING_PRIVATE_KEY_PEM: ${AUTH_SIGNING_PRIVATE_KEY_PEM:?Ed25519 private key required}
      AUTH_SIGNING_PUBLIC_KEYS_JSON: ${AUTH_SIGNING_PUBLIC_KEYS_JSON:?Ed25519 public keys required}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio}
      STORAGE_PORT: ${STORAGE_PORT:-9000}
      # CONFLICT-RESOLVED: Bật mã hóa TLS mặc định (STORAGE_USE_SSL=true) cho kết nối Object Storage trên môi trường Production (HIGH-12).
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-true}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Object storage access key required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Object storage secret key required}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WebAuthn RP ID required}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?WebAuthn origins required}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?Password reset base URL required}
      EXPORT_STORAGE_DIR: /var/lib/sda/exports
      GOTENBERG_URL: http://gotenberg:3000
    cpus: 2.0
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/api/v1/health/live',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *prod-defaults
    build:
      context: ../
      dockerfile: apps/worker/Dockerfile
    image: secure-document-access-worker:1.0.0
    user: '10001:10001'
    # CONFLICT-RESOLVED: Gắn thêm edge_loopback cho worker để duy trì kết nối tới Supabase/Redis/R2/SMTP bên ngoài nhưng không mở bất kỳ host port nào (HIGH-12).
    networks:
      - edge_loopback
      - backend_isolated
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - export_data:/var/lib/sda/exports
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Database connection required}
      REDIS_URL: ${REDIS_URL:?Redis connection required}
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY:?Master key required}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:?Audit integrity key required}
      DOCUMENT_AUDIT_HMAC_KEY: ${DOCUMENT_AUDIT_HMAC_KEY:?Document audit HMAC key required}
      AUTH_AUDIT_HMAC_KEY: ${AUTH_AUDIT_HMAC_KEY:?Auth audit HMAC key required}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio}
      STORAGE_PORT: ${STORAGE_PORT:-9000}
      # CONFLICT-RESOLVED: Bật mã hóa TLS mặc định (STORAGE_USE_SSL=true) cho kết nối Object Storage trên môi trường Production (HIGH-12).
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-true}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Object storage access key required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Object storage secret key required}
      EXPORT_STORAGE_DIR: /var/lib/sda/exports
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FROM: ${SMTP_FROM:-no-reply@sda.internal}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ICAP_SERVER_HOST: ${ICAP_SERVER_HOST:-127.0.0.1}
      ICAP_SERVER_PORT: '1344'
      ICAP_DLP_ACTION: ${ICAP_DLP_ACTION:-BLOCK}
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    <<: *prod-defaults
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    image: secure-document-access-web:1.0.0
    user: '1000:1000'
    networks:
      - edge_loopback
      - backend_isolated
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/apps/web/.next/cache:size=64m,noexec,nosuid,nodev
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  gotenberg:
    <<: *prod-defaults
    image: gotenberg/gotenberg:8.17.0
    user: '1001:1001'
    networks:
      - backend_isolated
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    environment:
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 128

networks:
  edge_loopback:
    name: sda-prod-edge-network
  backend_isolated:
    name: sda-prod-isolated-network
    internal: true

volumes:
  export_data:
    name: sda-prod-export-data
