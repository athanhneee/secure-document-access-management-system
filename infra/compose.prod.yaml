name: secure-document-access-system-prod

x-prod-defaults: &prod-defaults
  restart: always
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  api:
    <<: *prod-defaults
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    image: secure-document-access-api:1.0.0
    user: '10001:10001'
    networks:
      - edge_loopback
      - backend_isolated
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    volumes:
      - export_artifacts:/var/lib/sda/exports
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOST: '0.0.0.0'
      # Trust loopback + Docker internal bridge CIDR by default so Next.js proxy forwards real client IP;
      # narrow TRUST_PROXY to explicit reverse-proxy CIDRs in multi-tenant VPC deployments.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      AUTH_SESSION_IDLE_TTL_SECONDS: ${AUTH_SESSION_IDLE_TTL_SECONDS:-28800}
      AUTH_SESSION_TOUCH_INTERVAL_SECONDS: ${AUTH_SESSION_TOUCH_INTERVAL_SECONDS:-60}
      AUTH_MAX_CONCURRENT_SESSIONS: ${AUTH_MAX_CONCURRENT_SESSIONS:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Allowed CORS origins required}
      DATABASE_URL: ${DATABASE_URL:?Database connection required}
      REDIS_URL: ${REDIS_URL:?Redis connection required}
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY:?Master key required}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:?Audit integrity key required}
      DOCUMENT_AUDIT_HMAC_KEY: ${DOCUMENT_AUDIT_HMAC_KEY:?Document audit HMAC key required}
      AUTH_AUDIT_HMAC_KEY: ${AUTH_AUDIT_HMAC_KEY:?Auth audit HMAC key required}
      AUDIT_KEY_ROTATION_JSON: ${AUDIT_KEY_ROTATION_JSON:-}
      AUTH_SIGNING_PRIVATE_KEY_PEM: ${AUTH_SIGNING_PRIVATE_KEY_PEM:?Ed25519 private key required}
      AUTH_SIGNING_PUBLIC_KEYS_JSON: ${AUTH_SIGNING_PUBLIC_KEYS_JSON:?Ed25519 public keys required}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio}
      STORAGE_PORT: ${STORAGE_PORT:-9000}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-true}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Object storage access key required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Object storage secret key required}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WebAuthn RP ID required}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?WebAuthn origins required}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?Password reset base URL required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@sda.internal}
      EXPORT_STORAGE_DIR: /var/lib/sda/exports
      EXPORT_EXECUTION_MODE: worker
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      GOTENBERG_URL: http://gotenberg:3000
    cpus: 2.0
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/api/v1/health/live',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *prod-defaults
    build:
      context: ../
      dockerfile: apps/worker/Dockerfile
    image: secure-document-access-worker:1.0.0
    user: '10001:10001'
    networks:
      - edge_loopback
      - backend_isolated
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - export_artifacts:/var/lib/sda/exports
    expose:
      - '1344'
      - '9102'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Database connection required}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:?Audit integrity key required}
      DOCUMENT_AUDIT_HMAC_KEY: ${DOCUMENT_AUDIT_HMAC_KEY:-}
      AUDIT_KEY_ROTATION_JSON: ${AUDIT_KEY_ROTATION_JSON:-}
      EXPORT_STORAGE_DIR: /var/lib/sda/exports
      EXPORT_EXECUTION_MODE: worker
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FROM: ${SMTP_FROM:-no-reply@sda.internal}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ICAP_BIND_HOST: '0.0.0.0'
      ICAP_PORT: '1344'
      ICAP_DLP_ACTION: ${ICAP_DLP_ACTION:-BLOCK}
      WORKER_HEALTH_HOST: '0.0.0.0'
      WORKER_HEALTH_PORT: '9102'
      AUTH_SESSION_IDLE_TTL_SECONDS: ${AUTH_SESSION_IDLE_TTL_SECONDS:-28800}
      AUTH_SESSION_RETENTION_DAYS: ${AUTH_SESSION_RETENTION_DAYS:-30}
      AUTH_SESSION_CLEANUP_INTERVAL_MS: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:-300000}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 128
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.WORKER_HEALTH_PORT||9102)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    <<: *prod-defaults
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    image: secure-document-access-web:1.0.0
    user: '1000:1000'
    networks:
      - edge_loopback
      - backend_isolated
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /app/apps/web/.next/cache:size=64m,mode=1777,noexec,nosuid,nodev
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:3001}
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  gotenberg:
    <<: *prod-defaults
    image: gotenberg/gotenberg:8.17.0
    user: '1001:1001'
    networks:
      - backend_isolated
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    environment:
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 128

networks:
  edge_loopback:
    name: sda-prod-edge-network
  backend_isolated:
    name: sda-prod-isolated-network
    internal: true

volumes:
  export_artifacts:
    name: sda-prod-export-artifacts
