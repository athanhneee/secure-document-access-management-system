global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alert_rules.yml'
  - 'alert_rules.yml'

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: sda_api
    metrics_path: /api/v1/health/metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:3001', 'host.docker.internal:3001']

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
