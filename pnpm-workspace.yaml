packages:
  - apps/*
  - packages/*

autoInstallPeers: false
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    typescript: '7'
# CONFLICT-RESOLVED: Nâng cấp overrides trong pnpm-workspace.yaml (chuẩn pnpm v12 thay cho pnpm.overrides trong package.json) để vá triệt để 14 lỗ hổng Moderate và 5 Low trên fastify, fast-uri, uuid và nodemailer.
overrides:
  deepmerge-ts: 8.0.0
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
  fastify: 5.12.8
  mysql2: 3.23.1
  nodemailer: 10.3.1
  sharp: 0.35.5
  source-map-js: 1.2.2
  uuid@<11.1.1: 11.1.1
onlyBuiltDependencies:
  - sharp
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
